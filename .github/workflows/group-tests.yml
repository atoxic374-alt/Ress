name: Group system tests

on:
  pull_request:
    paths:
      - 'commands/groups.js'
      - 'utils/group*.js'
      - 'test-group-*.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/group-tests.yml'
  push:
    branches:
      - main
      - improve/group-v2-responses
    paths:
      - 'commands/groups.js'
      - 'utils/group*.js'
      - 'test-group-*.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/group-tests.yml'

jobs:
  group-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:groups
